[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtgen"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gtgen = "gtgen.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = [
    "tests/llm/test_d054_live.py",
    "tests/llm/test_api_keys.py",
    "tests/dialogue/test_d088.py",
    "tests/llm/test_google_backend.py",
    "tests/test_cli_skip.py",
]
